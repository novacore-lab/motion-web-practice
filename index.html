<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="description" content="MOTION LAB 閲覧用パスワードの入力画面"><title>MOTION LAB｜パスワード入力</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#101319;color:#f5f7f2}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 20% 0%,#26352377,transparent 56%),#101319}.card{width:min(100%,440px);padding:40px 32px;background:#191e25;border:1px solid #353e45;border-radius:24px;box-shadow:0 20px 90px #0004}.brand{font-size:13px;font-weight:800;letter-spacing:.13em;color:#c4ff5c;display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:35px;height:35px;border:1px solid #c4ff5c66;border-radius:9px;font-size:20px}h1{font-size:clamp(24px,6vw,30px);line-height:1.5;letter-spacing:-.03em;margin:32px 0 12px}p{color:#b5bfcc;font-size:14px;line-height:1.9;margin:0 0 28px}label{display:block;font-size:13px;font-weight:700;margin-bottom:10px}.field{display:flex;gap:8px}input{width:100%;min-width:0;background:#10141b;border:1px solid #55606c;color:white;padding:15px 14px;border-radius:9px;font:16px system-ui}input:focus{outline:2px solid #c4ff5c;outline-offset:3px}.show{flex:0 0 58px;background:transparent;color:#c6d0dc;border:1px solid #55606c;border-radius:9px;cursor:pointer;font-size:12px}.submit{width:100%;margin-top:20px;padding:16px;border:0;border-radius:9px;background:#c4ff5c;color:#17210b;font-size:15px;font-weight:800;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}#status{font-size:13px;line-height:1.7;min-height:45px;margin:16px 0 0;color:#ffbfac}.foot{font-size:11px;color:#8996a4;letter-spacing:.06em;border-top:1px solid #353e45;padding-top:22px;margin-top:12px;line-height:1.8}.foot span{display:block;color:#bac3cd;font-size:12px;letter-spacing:0;margin-bottom:4px}button:focus-visible{outline:2px solid white;outline-offset:3px}@media(max-width:420px){.card{padding:32px 23px}body{padding:18px}}@media(prefers-reduced-motion:no-preference){.card{animation:appear .35s ease-out}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style></head><body><main class="card"><div class="brand"><span class="mark" aria-hidden="true">M</span>MOTION LAB</div><h1>パスワードを入力して<br>はじめましょう。</h1><p>ホームページ制作実践キットをご利用の方は、<br>案内された閲覧用パスワードを入力してください。</p><form id="gate-form"><label for="password">閲覧用パスワード</label><div class="field"><input id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required aria-describedby="status"><button class="show" id="show" type="button" aria-label="パスワードを表示" aria-pressed="false">表示</button></div><button class="submit" id="enter" type="submit" disabled>サイトを開く →</button><div id="status" role="status" aria-live="polite"></div></form><noscript><p>表示するにはJavaScriptを有効にしてください。</p></noscript><div class="foot"><span>パスワードは、この端末の中で確認します。</span>LEARN → BUILD → DELIVER</div></main><script src="gate.js"></script></body></html>
